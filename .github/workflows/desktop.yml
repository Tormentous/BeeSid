# Build portable desktop folders on each operating system, without trading credentials.
name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-image0 libxcb-keysyms1 libxcb-icccm4 libxcb-render-util0 libxcb-util1 libxcb-xkb1
      - name: Install dependencies
        run: python -m pip install ".[dev,desktop]" pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build desktop folder
        run: python -m PyInstaller --noconfirm --windowed --onedir --name RapierDesk --collect-data rapier --collect-submodules rapier desktop_main.py
      - name: Include example reports
        run: python -c "import shutil; shutil.copytree('results', 'dist/RapierDesk/results', ignore=shutil.ignore_patterns('latest'))"
      - name: Upload desktop download
        uses: actions/upload-artifact@v4
        with:
          name: RapierDesk-${{ runner.os }}
          path: dist/RapierDesk/
          if-no-files-found: error
