# Build the one-file Bee Sid app (BeeSid.exe on Windows) on each OS and prove it starts; no trading credentials.
name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-image0 libxcb-keysyms1 libxcb-icccm4 libxcb-render-util0 libxcb-util1 libxcb-xkb1
      - name: Install dependencies
        run: python -m pip install ".[dev,desktop]" "pyinstaller>=6.10,<7"
      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and self-test the app
        run: python tools/build_desktop.py
        timeout-minutes: 20
      - name: Upload desktop download
        uses: actions/upload-artifact@v4
        with:
          name: BeeSid-${{ runner.os }}
          path: dist/BeeSid*
          if-no-files-found: error
